<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5A623">
  <meta name="mobile-web-app-capable" content="yes">
  <title>فطار الشغل 🥙</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=27">
  <link rel="stylesheet" href="css/additions.css?v=27">
  <style>
    /* Fallback styling so this page still looks good if the app styles fail to load. */
    :root { --breakfast-orange: #F5A623; --breakfast-dark: #3d3022; --breakfast-grey: #777; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #fffaf2; color: var(--breakfast-dark);
      font-family: Tahoma, Arial, sans-serif; display: flex; align-items: center; justify-content: center;
      padding: 22px;
    }
    .maintenance-wrap { width: 100%; max-width: 440px; text-align: center; }
    .maintenance-card {
      background: #fff; border: 1px solid #f2e6d4; border-radius: 24px;
      padding: 30px 23px 25px; box-shadow: 0 12px 35px rgba(91, 62, 20, .08);
    }
    .brand { color: #fff; background: var(--breakfast-orange); border-radius: 18px; padding: 17px 14px; margin-bottom: 25px; }
    .brand h1 { margin: 0; font-size: 25px; }
    .brand p { margin: 7px 0 0; font-size: 13px; opacity: .95; }
    .food-icon { font-size: 58px; line-height: 1.2; margin: 8px 0 18px; }
    h2 { font-size: 22px; margin: 0 0 12px; }
    .message { color: #6f675e; font-size: 15px; line-height: 1.9; margin: 0; }
    .status {
      display: inline-flex; align-items: center; gap: 7px; margin: 21px 0 17px;
      padding: 8px 13px; border-radius: 30px; background: #fff3df; color: #a85c00;
      font-size: 12px; font-weight: 700;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e99a25; }
    .note { background: #f8f8f8; border-radius: 13px; padding: 13px 14px; color: #777;
      font-size: 13px; line-height: 1.8; margin-top: 18px; }
    .footer { color: #aaa; font-size: 11px; margin-top: 19px; }
    @media (max-width: 360px) { .maintenance-card { padding: 24px 17px; } .brand h1 { font-size: 22px; } h2 { font-size: 20px; } }
  </style>
</head>
<body>
  <main class="maintenance-wrap">
    <section class="maintenance-card" aria-labelledby="page-title">
      <header class="brand">
        <h1 id="page-title">🥙 فطار الشغل</h1>
      </header>

      <div class="food-icon" aria-hidden="true">🧆</div>
      <h2>الموقع مش شغال حاليًا</h2>
      <p class="message">بسبب انتهاء الفترة التجريبية المجانية لخدمة الاستضافة (Free Trial).</p>
      <p class="message" style="margin-top:12px;font-weight:700;color:#a85c00;">راجعين قريب إن شاء الله ❤️</p>
      
    </section>
    <footer class="footer"></footer>
  </main>
</body>
</html>
